[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyrematching"
version = "0.0.1"
description = "Accelerating pymatching."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Sumeet Shirgure", email = "sumeetshirgure@gmail.com" },
]
keywords = [
    "quantum-error-correction",
    "surface-code",
    "decoder",
    "minimum-weight-perfect-matching",
    "blossom",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/sumeetshirgure/pyrematching"
Source = "https://github.com/sumeetshigure/pyrematching"
Issues = "https://github.com/sumeetshirgure/pyrematching/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrematching"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["extern", "build", "docs", "benchmarks", "*.egg-info"]
